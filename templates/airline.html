{% extends "base.html" %}
{% block title %}내 항공사 - Pilot Dream{% endblock %}
{% block content %}
<div class="max-w-6xl mx-auto">
    <div class="flex flex-wrap justify-between items-start gap-4 mb-6">
        <div>
            <h1 class="text-3xl font-bold mb-1" id="al-title">🏢 내 항공사</h1>
            <p class="text-gray-400 text-sm">CEO가 되어 비행기·노선·직원을 운영해요!</p>
        </div>
        <div class="info-card px-4 py-2 text-center border border-[#ffaa00]/40">
            <div class="text-xs text-gray-400">지갑</div>
            <div class="text-lg font-bold text-[#ffaa00]" id="al-wallet">—</div>
        </div>
    </div>
    <div id="al-not-founded" class="hidden info-card p-6 border border-[#0A84FF]/40 mb-6">
        <h2 class="font-bold text-lg mb-2">✈️ 항공사 창업 준비</h2>
        <p class="text-sm text-gray-400 mb-4" id="al-found-hint"></p>
        <div class="flex gap-2 flex-wrap">
            <input id="al-name" class="px-3 py-2 bg-black border rounded flex-1 min-w-[200px]" placeholder="항공사 이름 (예: 하늘나라 항공)">
            <input id="al-logo" class="px-3 py-2 bg-black border rounded w-20" placeholder="✈️" maxlength="4" value="✈️">
            <button onclick="foundAirline()" class="px-5 py-2 bg-[#ffaa00] text-black font-bold rounded">창업하기!</button>
        </div>
        <p class="text-xs text-gray-500 mt-3">비행기 <b>10대</b>를 모으면 창업할 수 있어요. <a href="/hangar" class="text-[#0A84FF]">창고 →</a></p>
    </div>
    <div id="al-founded" class="hidden">
        <div id="al-income-toast" class="hidden mb-3 info-card px-4 py-2 border border-[#33ff33]/40 text-sm text-[#33ff33] font-bold"></div>
        <div class="flex gap-1 mb-4 flex-wrap" id="al-tabs">
            <button data-tab="overview" class="al-tab active px-3 py-2 rounded-lg text-xs font-bold">📊 개요</button>
            <button data-tab="fleet" class="al-tab px-3 py-2 rounded-lg text-xs font-bold">✈️ 기재</button>
            <button data-tab="routes" class="al-tab px-3 py-2 rounded-lg text-xs font-bold">🗺️ 노선</button>
            <button data-tab="staff" class="al-tab px-3 py-2 rounded-lg text-xs font-bold">👥 채용</button>
            <button data-tab="revenue" class="al-tab px-3 py-2 rounded-lg text-xs font-bold">💰 수입원</button>
            <button data-tab="invest" class="al-tab px-3 py-2 rounded-lg text-xs font-bold">📈 투자</button>
            <button data-tab="treasury" class="al-tab px-3 py-2 rounded-lg text-xs font-bold">🏦 자금</button>
            <button data-tab="stats" class="al-tab px-3 py-2 rounded-lg text-xs font-bold">📊 능력</button>
            <button data-tab="space" class="al-tab px-3 py-2 rounded-lg text-xs font-bold">🚀 우주</button>
        </div>
        <div id="al-content" class="min-h-[360px]"></div>
    </div>
</div>

<!-- 노선 승무 배치 모달 -->
<div id="route-staff-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[5000] p-4" onclick="if(event.target===this)closeRouteStaffModal()">
    <div class="info-card w-full max-w-lg max-h-[90vh] overflow-y-auto border border-[#ffaa00]/40" onclick="event.stopPropagation()">
        <div id="route-staff-modal-body"></div>
    </div>
</div>

<!-- 동료 상세 모달 -->
<div id="crew-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[5000] p-4" onclick="if(event.target===this)closeCrewModal()">
    <div class="info-card w-full max-w-md border border-purple-500/40" onclick="event.stopPropagation()">
        <div id="crew-modal-body"></div>
    </div>
</div>

<style>
.al-tab { background:#1c1c1e; border:1px solid #2c2c2e; color:#8e8e93; }
.al-tab.active, .al-tab:hover { background:#1a1a00; border-color:#ffaa00; color:#ffaa00; }
.al-card { background:#0a0a0a; border:1px solid #2c2c2e; border-radius:12px; padding:14px; }
.stat-bar { height:6px; background:#111; border-radius:4px; overflow:hidden; }
.stat-bar div { height:100%; background:#0A84FF; border-radius:4px; transition:width .35s ease; }
.crew-hire-card { cursor:pointer; transition:border-color .15s, transform .15s; }
.crew-hire-card:hover { border-color:rgba(168,85,247,0.5); transform:translateY(-1px); }
.crew-hire-card.hired { border-color:rgba(51,255,51,0.4); }
.crew-hire-card.locked { opacity:.92; }
.crew-spec-box { background:#111; border:1px solid #2c2c2e; border-radius:8px; padding:8px; margin-top:8px; }
.crew-spec-row { display:flex; justify-content:space-between; font-size:10px; color:#aaa; margin-bottom:2px; }
.crew-spec-row b { color:#f5f5f7; }
.grade-S { color:#ffaa00; border-color:rgba(255,170,0,0.5); background:#2a2000; }
.grade-A { color:#a78bfa; border-color:rgba(167,139,250,0.5); background:#1a1030; }
.grade-B { color:#0A84FF; border-color:rgba(10,132,255,0.5); background:#001a33; }
.grade-C { color:#33ff33; border-color:rgba(51,255,51,0.4); background:#001a00; }
.grade-D { color:#888; border-color:#444; }
.crew-skill-bar { height:4px; background:#111; border-radius:3px; overflow:hidden; margin-top:2px; }
.crew-skill-bar div { height:100%; border-radius:3px; }
.crew-hired-badge { display:inline-block; font-size:9px; font-weight:700; color:#33ff33; background:rgba(51,255,51,0.12); border:1px solid rgba(51,255,51,0.35); border-radius:4px; padding:1px 6px; }
.crew-fire-btn { width:100%; margin-top:8px; padding:6px 10px; font-size:11px; font-weight:700; color:#fca5a5; background:rgba(127,29,29,0.35); border:1px solid rgba(239,68,68,0.55); border-radius:8px; cursor:pointer; transition:background .15s, border-color .15s; }
.crew-fire-btn:hover { background:rgba(153,27,27,0.55); border-color:#ef4444; color:#fff; }
.crew-hired-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; background:#111; border:1px solid #2c2c2e; border-radius:8px; }
.crew-hired-row .crew-fire-btn { width:auto; margin-top:0; padding:4px 10px; font-size:10px; flex-shrink:0; }
</style>
{% endblock %}
{% block scripts %}
<script src="/static/js/gamification.js"></script>
<script>
let D = {};
let staffRoleFilter = '전체';
let staffSort = 'rating';
let staffDivision = 'airline'; // airline | space
let routeStaffModalId = null;
let routeGroupMode = 'all';
let routeFilterKey = '';
const STAFF_ROLE_LABELS = {
    captain: '기장', fo: '부기장', fa: '승무원',
    mechanic: '정비사', dispatcher: '운항관리', ground: '지상직',
};
const SPACE_ROLE_LABELS = {
    mission_director: '발사 지휘', flight_dynamics: '궤도 계산', propulsion: '추진·연료',
    payload: '위성·탑재', ground_control: '지상 관제', business: '계약 담당',
};
function fmt(n) { return '₩'+(n||0).toLocaleString('ko-KR'); }

async function loadDash(opts = {}) {
    // 기본 light — 템플릿·전체 동료·tick 분리
    const light = opts.light !== false;
    const qs = new URLSearchParams();
    if (light) qs.set('light', '1');
    if (opts.tick) qs.set('tick', '1');
    const q = qs.toString() ? ('?' + qs.toString()) : '';
    const res = await fetch('/api/airline/dashboard' + q);
    const next = await res.json();
    // 지연 로드 캐시 유지
    if (D.ops) {
        if (!(next.ops?.route_templates || []).length && (D.ops.route_templates || []).length) {
            next.ops.route_templates = D.ops.route_templates;
        }
        if (!next.ops?.revenue_panel && D.ops.revenue_panel) {
            next.ops.revenue_panel = D.ops.revenue_panel;
        }
        if (!next.ops?.invest_panel && D.ops.invest_panel) {
            next.ops.invest_panel = D.ops.invest_panel;
        }
        // 전체 동료 풀은 대시보드에 안 옴 → 캐시 유지
        if (D.ops.crew_full && (D.ops.hireable_crew || []).length > (next.ops?.hireable_crew || []).length) {
            next.ops.hireable_crew = D.ops.hireable_crew;
            next.ops.crew_full = true;
        }
    }
    D = next;
    const al = D.airline || {};
    const ops = D.ops || {};
    document.getElementById('al-wallet').textContent = fmt(D.wallet?.balance || 0);
    if (!al.founded) {
        document.getElementById('al-not-founded').classList.remove('hidden');
        document.getElementById('al-founded').classList.add('hidden');
        document.getElementById('al-found-hint').textContent = al.kid_hint || `비행기 ${al.owned_count||0}/${al.need_count||10}대`;
        document.getElementById('al-title').textContent = '🏢 항공사 창업';
        return;
    }
    document.getElementById('al-not-founded').classList.add('hidden');
    document.getElementById('al-founded').classList.remove('hidden');
    document.getElementById('al-title').textContent = `${al.logo||'✈️'} ${al.name} · Lv.${ops.level||1}`;
    showEconomyTick(D.economy_tick);
    const tab = document.querySelector('.al-tab.active')?.dataset.tab || 'overview';
    await openAlTab(tab);
}

/** 탭별 무거운 데이터 지연 로드 */
async function ensureRouteTemplates() {
    if ((D.ops?.route_templates || []).length) return;
    try {
        const res = await fetch('/api/airline/route-templates');
        const d = await res.json();
        D.ops = D.ops || {};
        D.ops.route_templates = d.templates || [];
    } catch (e) { /* ignore */ }
}

async function ensureFullCrew() {
    if (D.ops?.crew_full) return;
    try {
        const res = await fetch('/api/airline/crew');
        const d = await res.json();
        D.ops = D.ops || {};
        D.ops.hireable_crew = d.hireable_crew || [];
        D.ops.crew_meta = d.crew_meta || D.ops.crew_meta;
        D.ops.crew_full = true;
    } catch (e) { /* ignore */ }
}

async function openAlTab(tab) {
    document.querySelectorAll('.al-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    const el = document.getElementById('al-content');
    if (tab === 'routes') {
        el.innerHTML = '<p class="text-gray-500 text-sm animate-pulse">노선 불러오는 중...</p>';
        await ensureRouteTemplates();
    } else if (tab === 'staff') {
        el.innerHTML = '<p class="text-gray-500 text-sm animate-pulse">동료 목록 불러오는 중...</p>';
        await ensureFullCrew();
        if (staffDivision === 'space') {
            try {
                const res = await fetch('/api/airline/space');
                D.space = await res.json();
            } catch (e) {}
        }
    } else if (tab === 'revenue') {
        el.innerHTML = renderRevenue();
        if (!D.ops?.revenue_panel) loadRevenuePanel();
        return;
    } else if (tab === 'invest') {
        // 단어장 비어 있으면 패널 강제 재로딩
        const needReload = !D.ops?.invest_panel || !(D.ops.invest_panel.glossary || []).length;
        if (needReload) {
            el.innerHTML = '<p class="text-gray-400 text-sm animate-pulse">투자 교실 불러오는 중...</p>';
            await loadInvestPanel(true);
        } else {
            el.innerHTML = renderInvest();
            await refreshInvestGlossary(false);
        }
        return;
    } else if (tab === 'treasury') {
        el.innerHTML = '<p class="text-gray-400 text-sm animate-pulse">자금관리 불러오는 중...</p>';
        await loadTreasuryPanel(true);
        return;
    } else if (tab === 'stats' && !(D.player_stats && Object.keys(D.player_stats).length)) {
        try {
            const res = await fetch('/api/player/stats');
            D.player_stats = await res.json();
        } catch (e) {}
    }
    const r = { overview: renderOverview, fleet: renderFleet, routes: renderRoutes, staff: renderStaff, revenue: renderRevenue, invest: renderInvest, treasury: renderTreasury, stats: renderStats, space: renderSpace };
    el.innerHTML = (r[tab] || renderOverview)();
    if (typeof bindUxCollapses === 'function') bindUxCollapses(el);
}

function showEconomyTick(tick) {
    const el = document.getElementById('al-income-toast');
    if (!tick || (!tick.gross && !tick.payroll)) {
        if (el) el.classList.add('hidden');
        return;
    }
    let msg = '';
    if (tick.gross > 0) msg += `✈️ 노선 운영 수익 +${fmt(tick.gross)}`;
    if (tick.payroll > 0) msg += `${msg ? ' · ' : ''}주급 −${fmt(tick.payroll)}`;
    if (!el) return;
    el.textContent = msg;
    el.classList.remove('hidden');
}

function renderAlTab(tab) {
    // 동기 호출 호환 — 내부는 openAlTab
    openAlTab(tab);
}

let _revenueLoading = false;
async function loadRevenuePanel(force) {
    if (_revenueLoading && !force) return;
    _revenueLoading = true;
    const el = document.getElementById('al-content');
    try {
        const res = await fetch('/api/airline/revenue');
        const data = await res.json();
        if (!res.ok || data.error) {
            el.innerHTML = `<div class="al-card text-sm"><p class="text-red-400 mb-2">${data.error || '수입원을 불러오지 못했어요.'}</p>
                <button onclick="loadRevenuePanel(true)" class="text-xs px-3 py-1.5 border border-[#ffaa00] text-[#ffaa00] rounded">다시 시도</button></div>`;
            return;
        }
        D.ops = D.ops || {};
        D.ops.revenue_panel = data.revenue_panel;
        if (data.revenue_preview) D.ops.revenue_preview = data.revenue_preview;
        if (data.ancillary) D.ops.ancillary = data.ancillary;
        if (data.wallet) D.wallet = data.wallet;
        if (document.querySelector('.al-tab.active')?.dataset.tab === 'revenue') {
            el.innerHTML = renderRevenue();
        }
    } catch (err) {
        el.innerHTML = `<div class="al-card text-sm"><p class="text-red-400 mb-2">수입원 연결 오류</p>
            <button onclick="loadRevenuePanel(true)" class="text-xs px-3 py-1.5 border rounded">다시 시도</button></div>`;
    } finally {
        _revenueLoading = false;
    }
}

function renderCompanyBoard() {
    const cb = D.ops?.company_board;
    if (!cb) return '';
    const al = cb.allocation || {};
    const story = (cb.story || []).map(s => `
        <div class="p-3 bg-black/40 rounded-xl flex gap-3 items-start">
            <span class="text-2xl">${s.emoji}</span>
            <div class="flex-1 min-w-0">
                <div class="flex justify-between gap-2 items-baseline">
                    <b class="text-sm">${s.label}</b>
                    <span class="font-bold text-sm ${s.amount>=0?'text-[#33ff33]':'text-red-300'}">${s.formatted}</span>
                </div>
                <div class="text-[10px] text-gray-400 mt-0.5">${s.kid}</div>
                <div class="text-[9px] text-gray-600 mt-0.5">${s.detail||''}</div>
            </div>
        </div>`).join('');
    const terms = (cb.terms || []).map(t =>
        `<span class="inline-block text-[9px] px-2 py-1 m-0.5 rounded-full border border-[#333] bg-black/30"><b class="text-[#ffaa00]">${t.word}</b> ${t.meaning}</span>`
    ).join('');
    const boosts = (cb.boosts || []).map(b => `<div class="text-[10px] text-[#33ff33]">${b}</div>`).join('');
    let allocHtml = '';
    if (al.done) {
        const last = al.last || {};
        allocHtml = `<div class="mt-3 p-3 rounded-xl border border-[#33ff33]/40 bg-[#001a00]/40 text-sm">
            ✅ 이번 주 CEO 회의 완료! ${last.emoji||''} <b>${last.label||''}</b>
            <div class="text-[10px] text-gray-400 mt-1">${last.message||'다음 주에 다시 만나요.'}</div>
        </div>`;
    } else if (al.available) {
        allocHtml = `<div class="mt-3">
            <div class="font-bold text-sm mb-1">📋 CEO 회의 — 이익을 어디에 쓸까요?</div>
            <p class="text-[10px] text-gray-400 mb-2">배치 가능 약 ${al.amount_formatted||fmt(0)} · 주 1회 선택</p>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                ${(al.choices||[]).map(ch => `
                <button type="button" onclick="allocateProfit('${ch.id}')"
                    class="text-left p-3 rounded-xl border border-[#2c2c2e] hover:border-[#ffaa00] bg-black/40 transition">
                    <div class="text-xl mb-1">${ch.emoji} <b class="text-sm">${ch.label}</b></div>
                    <div class="text-[10px] text-gray-400 mb-1">${ch.kid}</div>
                    <div class="text-[9px] text-[#0A84FF]">${ch.effect||''}</div>
                    <div class="text-[9px] text-gray-600 mt-1">개념: ${ch.concept||''}</div>
                </button>`).join('')}
            </div>
        </div>`;
    } else {
        allocHtml = `<p class="text-[10px] text-gray-500 mt-3">💡 노선 수익을 받으면 CEO 회의(이익 배치)가 열려요.</p>`;
    }
    return `<div class="al-card mb-4 border border-[#ffaa00]/35">
        <div class="flex flex-wrap justify-between items-start gap-2 mb-2">
            <div>
                <div class="font-bold text-sm">🏢 우리 회사 손익 보드</div>
                <p class="text-[10px] text-gray-400 mt-0.5">${cb.kid_summary||''}</p>
            </div>
            <div class="text-right">
                <div class="text-[10px] text-gray-500">회사 금고</div>
                <div class="font-bold text-[#0A84FF]">${cb.vault_formatted||fmt(0)}</div>
                <button type="button" onclick="openAlTab('treasury')" class="text-[9px] mt-1 px-2 py-0.5 border border-[#0A84FF]/50 text-[#0A84FF] rounded">🏦 자금관리</button>
                ${(cb.treasury?.capital||0)>0 ? `<button onclick="withdrawVault()" class="text-[9px] mt-1 ml-1 px-2 py-0.5 border border-[#33ff33]/40 text-[#33ff33] rounded">가수금 회수</button>` : ''}
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-2">${story}</div>
        ${boosts ? `<div class="mb-2 space-y-0.5">${boosts}</div>` : ''}
        ${allocHtml}
        <div class="mt-3 pt-2 border-t border-[#222]">
            <div class="text-[10px] text-gray-500 mb-1">📖 쉬운 단어장</div>
            <div>${terms}</div>
            <p class="text-[9px] text-gray-600 mt-2">더 자세한 설명은 <a href="/guide" class="text-[#0A84FF]">📖 가이드 → 회사 경영</a>을 보세요!
            · 가수금·대여·차입은 <button type="button" onclick="openAlTab('treasury')" class="text-[#0A84FF] underline">🏦 자금 탭</button>
            · 조각·투자는 <button type="button" onclick="openAlTab('invest')" class="text-[#0A84FF] underline">📈 투자 탭</button>!</p>
        </div>
    </div>`;
}

function renderOverview() {
    const ops = D.ops || {};
    const al = D.airline || {};
    const net = ops.last_net_revenue ?? ops.last_revenue ?? 0;
    const gross = ops.last_gross_revenue || 0;
    const payroll = ops.last_payroll || 0;
    const pp = ops.payroll_preview || {};
    const rv = ops.revenue_preview || {};
    const st = ops.settlement || {};
    const activeRoutes = rv.active_routes || 0;
    const dailyRate = activeRoutes ? Math.floor((rv.gross || 0) / 7) : 0;
    const side = rv.side_income || {};
    const settleHint = activeRoutes
        ? `노선 운영 시 매일 자동 수익 (하루 약 ${fmt(dailyRate)})`
        : '노선을 개설하면 매일 수익이 들어와요';
    const anc = ops.ancillary || 'basic';
    return `<div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
        <div class="al-card"><div class="text-xs text-gray-400">항공사 레벨</div><div class="text-2xl font-bold text-[#ffaa00]">Lv.${ops.level||1}</div><div class="text-[10px] text-gray-500">평판 ${ops.reputation||50}/100</div></div>
        <div class="al-card"><div class="text-xs text-gray-400">이번 주 예상 순수익</div><div class="text-2xl font-bold ${(rv.net||0)>=0?'text-[#33ff33]':'text-red-400'}">${rv.formatted_net||fmt(0)}</div>
            <div class="text-[9px] text-gray-500 mt-1">매출 ${rv.formatted_gross||fmt(0)} − 주급 ${rv.formatted_payroll||fmt(0)}</div>
            <div class="text-[9px] text-gray-500">노선 ${activeRoutes}개 · 부가수입 ${rv.formatted_side||fmt(0)} · 로그북 ${fmt(rv.log_bonus||0)}</div>
            <button onclick="settleNow()" class="text-[11px] mt-2 px-3 py-1.5 border border-[#33ff33] text-[#33ff33] rounded">미수령 수익 받기</button>
            <div class="text-[9px] text-gray-500 mt-1">${settleHint}</div></div>
        <div class="al-card"><div class="text-xs text-gray-400">지난 정산 순수익</div><div class="text-xl font-bold ${net>=0?'text-[#33ff33]':'text-red-400'}">${fmt(net)}</div>
            <div class="text-[9px] text-gray-500 mt-1">매출 ${fmt(gross)} − 주급 ${fmt(payroll)}</div></div>

let pendingCargoId = null;
function showCargoQuiz(offerId) {
    const rp = D.ops?.revenue_panel || {};
    const offer = (rp.cargo_offers||[]).find(o => o.id === offerId);
    const q = offer?.quiz || {q:'화물 운송 준비 완료?', choices:['완료'], answer:0};
    pendingCargoId = offerId;
    const body = `<div class="p-4"><div class="font-bold mb-2">📦 화물 운송 퀴즈</div><p class="text-sm mb-3">${q.q}</p>
        ${(q.choices||[]).map((c,i)=>`<button onclick="submitCargoQuiz(${i})" class="block w-full text-left px-3 py-2 mb-2 border rounded hover:border-[#33ff33]">${c}</button>`).join('')}
        <button onclick="closeCargoQuiz()" class="text-xs text-gray-500 mt-2">취소</button></div>`;
    let modal = document.getElementById('cargo-quiz-modal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'cargo-quiz-modal';
        modal.className = 'fixed inset-0 bg-black/80 flex items-center justify-center z-[5000] p-4';
        modal.onclick = e => { if (e.target===modal) closeCargoQuiz(); };
        document.body.appendChild(modal);
    }
    modal.innerHTML = `<div class="info-card w-full max-w-md border border-[#ffaa00]/40" onclick="event.stopPropagation()">${body}</div>`;
    modal.classList.remove('hidden');
}
function closeCargoQuiz() {
    pendingCargoId = null;
    document.getElementById('cargo-quiz-modal')?.classList.add('hidden');
}
function submitCargoQuiz(ans) {
    if (!pendingCargoId) return;
    apiPost('/api/airline/revenue/cargo/complete', { offer_id: pendingCargoId, answer: ans });
    closeCargoQuiz();
}
function acceptCargo(id) { apiPost('/api/airline/revenue/cargo/accept', { offer_id: id }); }
function completeCargo(id) { showCargoQuiz(id); }
function toggleLease(id) { apiPost('/api/airline/revenue/lease', { aircraft_id: id }); }
function setMroDesk(on) { apiPost('/api/airline/revenue/mro', { enabled: on }); }
function setFleetMaintain(on) { apiPost('/api/airline/revenue/maintain', { enabled: on }); }
function answerBriefing(idx, ans) { apiPost('/api/airline/revenue/briefing', { idx, answer: ans }); }
function toggleCodeshare(id) { apiPost('/api/airline/revenue/codeshare', { partner_id: id }); }
function runTraining(id, ans) { apiPost('/api/airline/revenue/training', { module_id: id, answer: ans }); }
function claimSeasonal() { apiPost('/api/airline/revenue/seasonal', {}); }

function renderCabinKitchen(cm, side) {
    if (!cm) {
        return `<div class="al-card border border-[#ffaa00]/30">
            <div class="font-bold text-sm">🍱 기내식 키친</div>
            <p class="text-[10px] text-gray-500 mt-1">불러오는 중… 수입원 탭을 다시 열어 보세요.</p>
        </div>`;
    }
    const est = cm.estimate || {};
    const net = cm.estimate_net != null ? cm.estimate_net : (side?.cabin_meals || 0);
    const netCls = net >= 0 ? 'text-[#33ff33]' : 'text-red-400';
    const fb = cm.feedback || {};
    const slotSet = new Set(cm.slots || []);
    const unlocked = (cm.meals || []).filter(m => m.unlocked);
    const locked = (cm.meals || []).filter(m => !m.unlocked);

    const policyBtns = (cm.policies || []).map(p =>
        `<button onclick="cabinPolicy('${p.id}')" class="text-[10px] px-2 py-1.5 rounded font-bold ${p.selected?'bg-[#ffaa00] text-black':'border border-[#444]'}">${p.emoji||''} ${p.label}</button>`
    ).join('');
    const prepBtns = (cm.preps || []).map(p =>
        `<button onclick="cabinPrep('${p.id}')" class="text-[10px] px-2 py-1 rounded ${p.selected?'bg-purple-600 text-white':'border border-[#333] text-gray-400'}">${p.label}</button>`
    ).join('');

    const slotChips = (cm.slot_labels || []).map(s =>
        `<span class="inline-flex items-center gap-1 px-2 py-1 bg-black/50 rounded text-[10px] mr-1 mb-1">${s.emoji} ${s.name}
            <button onclick="cabinToggle('${s.id}')" class="text-red-400 ml-1" title="빼기">×</button></span>`
    ).join('') || '<span class="text-[10px] text-gray-500">슬롯이 비었어요. 아래 메뉴를 눌러 올려 보세요!</span>';

    const mealCard = (m) => {
        const on = slotSet.has(m.id);
        const lockedCls = m.unlocked ? '' : 'opacity-50';
        const tip = String(m.unlock_tip || '잠김').replace(/'/g, '');
        const click = m.unlocked ? `cabinToggle('${m.id}')` : `alert('🔒 ${tip}')`;
        return `<button type="button" onclick="${click}"
            class="p-2 rounded-xl border text-left ${on?'border-[#ffaa00] bg-[#2a2000]':'border-[#2c2c2e] bg-black/30'} ${lockedCls}">
            <div class="text-xl">${m.emoji}</div>
            <div class="text-[11px] font-bold truncate">${m.name}</div>
            <div class="text-[9px] text-gray-500">${m.category}${on?' · ✓슬롯':''}</div>
            ${m.unlocked
                ? `<div class="text-[9px] mt-1">원가 ${m.cost_formatted} · 판매 ${m.price_formatted}<br>
                    <span class="text-[#33ff33]">마진 ${m.margin_formatted} (${m.margin_pct}%)</span>
                    · 만족 ${m.satisfaction}</div>
                   <div class="text-[8px] text-gray-600 mt-0.5">${m.edu||m.kid||''}</div>`
                : `<div class="text-[9px] text-[#ffaa00] mt-1">🔒 ${m.unlock_tip||''}</div>`}
        </button>`;
    };

    const fbHtml = !fb.q ? '' : (fb.done
        ? `<div class="text-[10px] text-[#33ff33] mt-2">✓ 이번 주 피드백 완료${fb.last?.ok?' · 정답!':''}</div>`
        : `<div class="mt-3 p-2 border border-[#0A84FF]/40 rounded">
            <div class="font-bold text-xs mb-1">🎓 주간 손님 피드백</div>

let _investLoading = false;
async function loadInvestPanel(force) {
    if (_investLoading && !force) return;
    _investLoading = true;
    const el = document.getElementById('al-content');
    try {
        const res = await fetch('/api/airline/invest');
        const data = await res.json();
        if (!res.ok || data.error) {
            if (el) el.innerHTML = `<div class="al-card"><p class="text-red-400 text-sm">${data.error||'투자 정보를 불러오지 못했어요.'}</p>
                <button onclick="loadInvestPanel(true)" class="mt-2 text-xs px-3 py-1 border rounded">다시 시도</button></div>`;
            return;
        }
        D.ops = D.ops || {};
        D.ops.invest_panel = data.invest_panel;
        if (data.wallet) {
            D.wallet = data.wallet;
            const w = document.getElementById('al-wallet');
            if (w && data.wallet.balance != null) w.textContent = fmt(data.wallet.balance);
        }
        if (data.invest_panel?.sale_backfill_message) {
            alert(data.invest_panel.sale_backfill_message);
        }
        if (document.querySelector('.al-tab.active')?.dataset.tab === 'invest') {
            el.innerHTML = renderInvest();
            refreshInvestGlossary(false);
        }
    } catch (e) {
        if (el) el.innerHTML = '<p class="text-red-400 text-sm">투자 탭 연결 오류</p>';
    } finally {
        _investLoading = false;
    }
}

/** 쉬운 단어장: 라이브러리에서 5개 랜덤 (최근 본 단어 제외 우선) */
let _glossarySeen = [];
let _glossaryLib = null; // 캐시된 전체 목록

function getGlossaryLib() {
    if (_glossaryLib && _glossaryLib.length) return _glossaryLib;
    const fromPanel = D.ops?.invest_panel?.glossary;
    if (Array.isArray(fromPanel) && fromPanel.length) {
        _glossaryLib = fromPanel;
        return _glossaryLib;
    }
    return [];
}

async function ensureGlossaryLib() {
    if (getGlossaryLib().length) return getGlossaryLib();
    try {
        const res = await fetch('/api/airline/invest/glossary');
        const d = await res.json();
        if (Array.isArray(d.glossary) && d.glossary.length) {
            _glossaryLib = d.glossary;
            if (D.ops?.invest_panel) {
                D.ops.invest_panel.glossary = d.glossary;
                D.ops.invest_panel.glossary_count = d.glossary_count || d.glossary.length;
            }
            return _glossaryLib;
        }
    } catch (e) { /* ignore */ }
    return [];
}

function pickGlossaryTerms(n) {
    const lib = getGlossaryLib().slice();
    if (!lib.length) return [];
    const pool = lib.filter(t => t && t.word && !_glossarySeen.includes(t.word));
    const use = (pool.length >= n ? pool : lib).slice();
    for (let i = use.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [use[i], use[j]] = [use[j], use[i]];
    }
    const picked = use.slice(0, n);
    picked.forEach(t => {
        if (t.word && !_glossarySeen.includes(t.word)) _glossarySeen.push(t.word);
    });
    if (_glossarySeen.length >= lib.length * 0.85) _glossarySeen = picked.map(t => t.word);
    return picked;
}

function renderGlossaryChips(terms) {
    return (terms || []).map(t =>
        `<span class="inline-block text-[10px] px-2.5 py-1.5 m-0.5 rounded-xl border border-[#333] bg-black/40 max-w-full">
            <b class="text-[#ffaa00]">${t.word||''}</b>
            ${t.category ? `<span class="text-[8px] text-gray-600 ml-1">[${t.category}]</span>` : ''}
            <span class="text-gray-400"> — ${t.meaning||''}</span>
        </span>`
    ).join('');
}

async function refreshInvestGlossary(append) {
    const el = document.getElementById('invest-glossary');
    if (!el) return;
    el.innerHTML = append ? el.innerHTML : '<span class="text-gray-500">단어 불러오는 중…</span>';
    const lib = await ensureGlossaryLib();
    // 카운트 표시 갱신
    const countEl = document.getElementById('invest-glossary-count');
    if (countEl) countEl.textContent = `라이브러리 ${lib.length}개 · 5개씩 랜덤`;
    const picked = pickGlossaryTerms(5);
    if (!picked.length) {
        el.innerHTML = '<span class="text-red-400">단어를 불러오지 못했어요. 다시 시도 버튼을 눌러주세요.</span>';
        return;
    }
    const chips = renderGlossaryChips(picked);
    if (append && el.querySelector('.rounded-xl')) {
        el.insertAdjacentHTML('beforeend', chips);
    } else {
        el.innerHTML = chips;
    }
}

};

function renderRouteTemplateOptions(tpls, groupBy) {
    const keyFn = {
        type: t => t.type || 'domestic',
        region: t => t.kid_label || '기타',
        aircraft: t => t.min_category || '소형',
    }[groupBy] || (t => t.type || 'domestic');
    const grouped = {};
    tpls.forEach(t => {
        const k = keyFn(t);

    });
    const keys = Object.keys(grouped).sort();
    const labelFn = k => groupBy === 'type' ? (ROUTE_TYPE_LABELS[k] || k) : k;
    return keys.map(k => `
        <optgroup label="${labelFn(k)} (${grouped[k].length})">
            ${grouped[k].map(t => `<option value="${t.id}">${t.name} · ${t.route} · ${t.min_category||''} · 수요${t.demand}</option>`).join('')}

}

function filterRoutesList(routes) {
    if (!routeFilterKey) return routes;
    if (routeGroupMode === 'type') return routes.filter(r => (r.type || 'domestic') === routeFilterKey);
    if (routeGroupMode === 'region') return routes.filter(r => (r.region || '기타') === routeFilterKey);
    if (routeGroupMode === 'aircraft') {
        return routes.filter(r => (r.aircraft_category || r.aircraft_name || '미지정') === routeFilterKey);
    }
    return routes;
}

function groupRoutesList(routes) {
    if (routeGroupMode === 'all') return { '전체 노선': routes };
    const keyFn = {
        type: r => r.type || 'domestic',
        region: r => r.region || '기타',
        aircraft: r => r.aircraft_category || r.aircraft_name || '미지정',
    }[routeGroupMode];
    const groups = {};
    routes.forEach(r => {
        const k = keyFn(r);
        const label = routeGroupMode === 'type' ? (ROUTE_TYPE_LABELS[k] || k) : k;
        (groups[label] ||= []).push(r);
    });
    return groups;
}

function setRouteGroupMode(mode, key) {
    routeGroupMode = mode;
    routeFilterKey = key || '';
    renderAlTab('routes');
}

}

function hiredPool(role) {
    return (D.ops?.hireable_crew || []).filter(c => c.hired && c.airline_role === role);
}

function crewOption(c, selected) {
    const p = c.profile || {};
    const sel = selected === c.id ? 'selected' : '';
    return `<option value="${c.id}" ${sel}>${c.emoji} ${c.name} [${p.grade}] ${p.specialty||''}</option>`;
}

function openRouteStaffModal(routeId) {
    routeStaffModalId = routeId;
    const route = (D.ops?.routes || []).find(r => r.id === routeId);
    if (!route) return;
    const st = route.staff || {};
    const faSel = new Set(st.fa || []);
    const caps = hiredPool('captain');
    const fos = hiredPool('fo');
    const fas = hiredPool('fa');
    const mechs = hiredPool('mechanic');
    const disps = hiredPool('dispatcher');
    const faChecks = fas.map(c => `
        <label class="flex items-center gap-2 text-[10px] p-1 hover:bg-white/5 rounded">
            <input type="checkbox" class="rs-fa-cb" value="${c.id}" ${faSel.has(c.id)?'checked':''}>
            ${c.emoji} ${c.name} <span class="${gradeClass(c.profile?.grade)} px-1 rounded text-[9px]">${c.profile?.grade}</span> ${c.profile?.specialty||''}
        </label>`).join('') || '<p class="text-[10px] text-gray-500">채용된 승무원이 없어요</p>';

    document.getElementById('route-staff-modal-body').innerHTML = `
        <div class="p-4 border-b border-[#ffaa00]/20 flex justify-between sticky top-0 bg-[#1c1c1e] z-10">
            <div><h3 class="font-bold">👥 ${route.name} 승무 배치</h3>
                <p class="text-[10px] text-gray-400">${route.route} · ${route.type} · 승무원 ${route.fa_need||2}명 필요</p></div>
            <button onclick="closeRouteStaffModal()" class="text-xl text-gray-400">×</button>
        </div>
        <div class="p-4 space-y-3 text-xs">
            <div><label class="text-gray-400">👑 기장</label>
                <select id="rs-captain" class="w-full mt-1 bg-black border rounded p-2 text-xs">
                    <option value="">— 미배치 —</option>${caps.map(c => crewOption(c, st.captain)).join('')}
                </select></div>
            <div><label class="text-gray-400">👨‍✈️ 부기장</label>
                <select id="rs-fo" class="w-full mt-1 bg-black border rounded p-2 text-xs">
                    <option value="">— 미배치 —</option>${fos.map(c => crewOption(c, st.fo)).join('')}
                </select></div>
            <div><label class="text-gray-400">💁 승무원 (복수 선택)</label><div class="mt-1 max-h-28 overflow-y-auto border rounded p-2">${faChecks}</div></div>
            <div><label class="text-gray-400">🔧 정비사</label>
                <select id="rs-mechanic" class="w-full mt-1 bg-black border rounded p-2 text-xs">
                    <option value="">— 미배치 —</option>${mechs.map(c => crewOption(c, st.mechanic)).join('')}
                </select></div>
            <div><label class="text-gray-400">📋 운항관리</label>
                <select id="rs-dispatcher" class="w-full mt-1 bg-black border rounded p-2 text-xs">
                    <option value="">— 미배치 —</option>${disps.map(c => crewOption(c, st.dispatcher)).join('')}
                </select></div>
            <button onclick="saveRouteStaff()" class="w-full py-2 bg-[#ffaa00] text-black font-bold rounded">배치 저장</button>
        </div>`;
    const modal = document.getElementById('route-staff-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
}

function closeRouteStaffModal() {
    routeStaffModalId = null;
    const modal = document.getElementById('route-staff-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
}

async function saveRouteStaff() {
    if (!routeStaffModalId) return;
    const fa = [...document.querySelectorAll('.rs-fa-cb:checked')].map(el => el.value);
    const staff = {
        captain: document.getElementById('rs-captain')?.value || null,
        fo: document.getElementById('rs-fo')?.value || null,
        fa,
        mechanic: document.getElementById('rs-mechanic')?.value || null,
        dispatcher: document.getElementById('rs-dispatcher')?.value || null,
    };
    await apiPost('/api/airline/route/staff', { route_id: routeStaffModalId, staff });
    closeRouteStaffModal();
    renderAlTab('routes');
}

async function autoAssignAllRoutes() {
    const n = (D.ops?.routes || []).length;
    if (!n) {
        alert('먼저 노선을 개설해주세요!');
        return;
    }
    if (!confirm(`채용된 직원을 ${n}개 노선에 랜덤으로 골고루 배치할까요?\n(기존 배치는 덮어써요 · 1인 우선 최대 5노선)`)) return;
    await apiPost('/api/airline/route/staff/auto-assign', { max_per_crew: 5 });
    renderAlTab('routes');
}

function setStaffFilter(role) {
    staffRoleFilter = role;
    renderAlTab('staff');
}

function setStaffSort(sort) {
    staffSort = sort;
    renderAlTab('staff');
}

function fmtPay(n) { return '₩' + (n||0).toLocaleString('ko-KR'); }

function gradeClass(g) { return 'grade-' + (g || 'C'); }

function sortCrewList(list) {
    const arr = [...list];
    if (staffSort === 'rating') arr.sort((a, b) => (b.profile?.overall||0) - (a.profile?.overall||0));
    else if (staffSort === 'pay') arr.sort((a, b) => (b.profile?.weekly_pay||0) - (a.profile?.weekly_pay||0));
    else if (staffSort === 'exp') arr.sort((a, b) => (b.profile?.experience_years||0) - (a.profile?.experience_years||0));
    else arr.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
    return arr;
}

function renderCrewSkills(p, compact) {
    if (!p?.skills?.length) return '<div class="text-[9px] text-gray-500">능력 정보 없음</div>';
    const max = compact ? 3 : 3;
    return p.skills.slice(0, max).map(s => `
        <div class="${compact?'text-[9px]':'text-[10px]'} mt-1">
            <div class="flex justify-between"><span>${s.emoji} ${s.name}</span><span>${s.value}</span></div>
            <div class="crew-skill-bar"><div style="width:${s.value}%;background:${s.value>=80?'#33ff33':s.value>=60?'#0A84FF':'#666'}"></div></div>
        </div>`).join('');
}

function renderCrewSpecBox(p, compact) {
    if (!p || !p.overall) return '<div class="crew-spec-box text-[10px] text-gray-500">스펙 로딩 중...</div>';
    const g = p.grade || 'C';
    return `<div class="crew-spec-box">
        <div class="flex justify-between items-center mb-1">
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded border ${gradeClass(g)}">${p.grade_emoji||''} ${g}등급</span>
            <span class="text-xs font-bold text-white">종합 ${p.overall}</span>
        </div>
        <div class="crew-spec-row"><span>경력</span><b>${p.experience_years||0}년 · ${(p.flight_hours||0).toLocaleString()}h</b></div>
        <div class="crew-spec-row"><span>특기</span><b class="text-[#a78bfa]">${p.specialty||'—'}</b></div>
        <div class="crew-spec-row"><span>성격</span><b>${p.personality||'—'}</b></div>
        <div class="crew-spec-row"><span>주급</span><b class="text-[#ffaa00]">${fmtPay(p.weekly_pay)}</b></div>
        ${compact ? renderCrewSkills(p, true) : ''}
    </div>`;
}

function renderCrewHireCard(c) {
    const p = c.profile || {};
    const g = p.grade || 'C';
    const locked = !c.unlocked;
    const cls = `al-card crew-hire-card ${c.hired?'hired':''} ${locked?'locked':''} border ${gradeClass(g)}`;
    let action = '';
    if (c.hired) {
        action = `<button type="button" onclick="event.stopPropagation();fireCrew('${c.id}')" class="crew-fire-btn">🚪 해고하기</button>`;
    } else if (c.unlocked) {
        action = `<button onclick="event.stopPropagation();hireCrew('${c.id}')" class="text-[10px] mt-2 w-full px-2 py-1 bg-purple-600 rounded font-bold hover:bg-purple-500">✅ 채용하기</button>
            <div class="text-[9px] text-[#33ff33] mt-1">기장생활에서 만난 동료</div>`;
    } else {
        action = `<div class="text-[10px] text-[#ffaa00] mt-2">🔒 기장생활에서 먼저 만나요<br>조건: ${c.bonus_tip || '활동 더하기'}</div>
            <a href="/captain-life" onclick="event.stopPropagation()" class="text-[9px] text-[#0A84FF] mt-1 inline-block">기장생활 →</a>`;
    }

    return `<div class="${cls}" onclick="openCrewModal('${c.id}')">
        <div class="flex justify-between items-start gap-1">
            <span class="text-2xl">${c.emoji}</span>
            <div class="text-right">
                ${c.hired ? '<span class="crew-hired-badge">✓ 채용됨</span>' : ''}
                <div class="text-[9px] text-gray-500 mt-0.5">${c.role}</div>
            </div>
        </div>
        <div class="font-bold text-sm mt-1">${c.name}</div>
        ${renderCrewSpecBox(p, true)}
        ${action}
    </div>`;
}

    const p = c.profile || {};

                <span class="text-4xl">${c.emoji}</span>
                <div>
                    <div class="font-bold text-lg">${c.name}</div>

                    <span class="text-xs font-bold px-2 py-0.5 rounded border mt-1 inline-block ${gradeClass(g)}">${p.grade_emoji||''} ${g}등급 · 종합 ${p.overall}</span>

                <div><span class="text-gray-500">특기</span> <b class="text-[#a78bfa]">${p.specialty||'—'}</b></div>

                <button type="button" onclick="fireCrew('${c.id}');closeCrewModal();" class="crew-fire-btn">🚪 해고하기 (노선 배치에서도 제외)</button>

              `<div class="text-center text-[#ffaa00] text-xs py-2">🔒 아직 못 만났어요: ${c.bonus_tip}<br>
                <a href="/captain-life" class="text-[#0A84FF] mt-2 inline-block">기장생활에서 만나기 →</a></div>`}
        </div>`;
    const modal = document.getElementById('crew-modal');
    modal.classList.remove('hidden');

function closeCrewModal() {
    const modal = document.getElementById('crew-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
}

function setStaffDivision(div) {
    staffDivision = div;
    staffRoleFilter = '전체';
    openAlTab('staff');
}

function renderStaff() {
    const divToggle = `<div class="flex gap-2 mb-4">
        <button type="button" onclick="setStaffDivision('airline')" class="flex-1 py-2 rounded-xl font-bold text-sm border ${staffDivision==='airline'?'bg-purple-600 border-purple-400 text-white':'border-[#333] text-gray-400'}">✈️ 항공 팀</button>
        <button type="button" onclick="setStaffDivision('space')" class="flex-1 py-2 rounded-xl font-bold text-sm border ${staffDivision==='space'?'bg-indigo-600 border-indigo-400 text-white':'border-[#333] text-gray-400'}">🚀 우주 팀</button>
    </div>`;
    if (staffDivision === 'space') return divToggle + renderSpaceStaff();
    return divToggle + renderAirlineStaff();
}

function renderAirlineStaff() {
    const crew = D.ops?.hireable_crew || [];
    const meta = D.ops?.crew_meta || {};
    const pool = D.ops?.staff_pool || {};
    const hired = meta.hired_count ?? Object.values(pool).flat().length;
    const poolTotal = meta.pool_total || crew.length;
    const roleKeys = ['전체', '채용됨', ...Object.keys(STAFF_ROLE_LABELS)];
    let filtered = staffRoleFilter === '전체' ? crew
        : staffRoleFilter === '채용됨' ? crew.filter(c => c.hired)
        : crew.filter(c => c.airline_role === staffRoleFilter);
    filtered = sortCrewList(filtered);
    const summary = Object.entries(STAFF_ROLE_LABELS).map(([k, label]) => {
        const inPool = (pool[k] || []).length;
        const avail = crew.filter(c => c.airline_role === k && c.unlocked && !c.hired).length;
        return `${label} ${inPool}명${avail ? ` (+${avail})` : ''}`;
    }).join(' · ');
    const hiredList = crew.filter(c => c.hired);
    const readyList = crew.filter(c => c.unlocked && !c.hired);
    const hiredInner = hiredList.map(c => {
        const p = c.profile || {};
        const roleLabel = STAFF_ROLE_LABELS[c.airline_role] || c.role;
        return `<div class="crew-hired-row">
            <div class="min-w-0">
                <span class="text-sm">${c.emoji} <b>${c.name}</b></span>
                <span class="text-[10px] text-gray-500 ml-1">${roleLabel} · ${p.grade||'?'}등급 · ${fmtPay(p.weekly_pay)}/주</span>
            </div>
            <button type="button" onclick="fireCrew('${c.id}')" class="crew-fire-btn">해고</button>
        </div>`;
    }).join('');
    const hiredBar = hiredList.length && typeof uxCollapseHtml === 'function'
        ? uxCollapseHtml('al-hired', '👥 채용된 승무원', `(${hiredList.length}명)`, `<div class="space-y-2">${hiredInner}</div>
            <button type="button" onclick="setStaffFilter('채용됨')" class="text-[10px] text-gray-400 hover:text-white mt-2">필터: 채용됨만 보기 →</button>`, { color: '#f87171' })
        : (hiredList.length ? `<div class="al-card mb-4 p-3 border border-red-500/30"><div class="space-y-2">${hiredInner}</div></div>` : '');
    const unlockedN = crew.filter(c => c.unlocked).length;
    const readyN = readyList.length;
    let listHtml = '';
    if (staffRoleFilter === '채용됨') {
        listHtml = `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">${filtered.map(c => renderCrewHireCard(c)).join('')}</div>`;
    } else {
        const showReady = filtered.filter(c => c.unlocked && !c.hired);
        const showLocked = filtered.filter(c => !c.unlocked);
        listHtml = `
            <h3 class="text-sm font-bold text-purple-300 mb-2">✨ 지금 채용 가능 (${showReady.length})</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 mb-4">${showReady.map(c => renderCrewHireCard(c)).join('') || '<p class="text-xs text-gray-500 col-span-full">채용 가능한 동료가 없어요. 기장생활에서 더 만나세요!</p>'}</div>
            ${showLocked.length && typeof uxCollapseHtml === 'function' ? uxCollapseHtml('al-locked-crew', '🔒 아직 못 만난 동료', `(${showLocked.length})`, `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">${showLocked.map(c => renderCrewHireCard(c)).join('')}</div>`, { color: '#888' }) : ''}`;
    }
    return `${hiredBar}<div class="al-card mb-4 p-3 border border-purple-500/30 text-[10px] text-gray-400">
        🔗 <b class="text-white">기장생활 → 항공 채용</b> · 노선에 배치해요.
        해금 <b class="text-[#33ff33]">${unlockedN}</b> · 채용 가능 <b class="text-purple-300">${readyN}</b>
        · <a href="/captain-life" class="text-[#0A84FF]">기장생활 →</a>
        · <a href="/guide#space_staff" class="text-[#0A84FF]">우주 팀 가이드 →</a>
    </div>
    <p class="text-xs text-gray-400 mb-1">동료 풀 <b>${poolTotal}</b> · 채용 <b>${hired}</b>명</p>
    <p class="text-[10px] text-gray-500 mb-3">${summary}</p>
    <div class="flex gap-1 mb-2 flex-wrap">
        ${roleKeys.map(r => `<button onclick="setStaffFilter('${r}')" class="px-2 py-1 rounded-full text-[10px] border ${staffRoleFilter===r?'border-[#ffaa00] text-[#ffaa00]':'border-[#333] text-gray-400'}">${r==='전체'||r==='채용됨'?r:STAFF_ROLE_LABELS[r]}</button>`).join('')}
    </div>
    <div class="flex gap-1 mb-4 flex-wrap items-center">
        <span class="text-[10px] text-gray-500">정렬:</span>
        ${[['rating','등급순'],['pay','주급순'],['exp','경력순'],['name','이름순']].map(([k,l]) =>
            `<button onclick="setStaffSort('${k}')" class="px-2 py-1 rounded-full text-[10px] border ${staffSort===k?'border-purple-500 text-purple-400':'border-[#333] text-gray-400'}">${l}</button>`
        ).join('')}
    </div>
    ${listHtml}`;
}

function renderSpaceStaff() {
    const sp = D.space || {};
    if (!sp.unlocked) {
        return `<div class="al-card border border-purple-500/30">
            <h3 class="font-bold">🚀 우주 팀 (잠김)</h3>
            <p class="text-xs text-gray-400 mt-2">우주 사업부가 열리면 여기서 채용해요. ${sp.kid_hint||''}</p>
            <a href="/guide#space_staff" class="text-xs text-[#0A84FF] mt-2 inline-block">가이드 →</a>
        </div>`;
    }
    if (!sp.founded) {
        return `<div class="al-card">
            <p class="text-sm text-gray-300">먼저 <button type="button" onclick="openAlTab('space')" class="text-purple-400 underline">우주 탭</button>에서 사업부를 설립하세요!</p>
        </div>`;
    }
    const st = sp.staff || {};
    const crew = st.hireable || [];
    const meta = st.meta || {};
    const roleLabels = st.role_labels || SPACE_ROLE_LABELS;
    const roleKeys = ['전체', '채용됨', ...Object.keys(SPACE_ROLE_LABELS)];
    let filtered = staffRoleFilter === '전체' ? crew
        : staffRoleFilter === '채용됨' ? crew.filter(c => c.hired)
        : crew.filter(c => c.space_role === staffRoleFilter);
    const hiredList = crew.filter(c => c.hired);
    const readyList = crew.filter(c => c.unlocked && !c.hired);

    const slotSelect = (role, currentId, onchangeFn) => {
        const opts = crew.filter(c => c.hired && c.space_role === role)
            .map(c => `<option value="${c.id}" ${c.id===currentId?'selected':''}>${c.emoji} ${c.name}</option>`).join('');
        return `<select onchange="${onchangeFn}" class="text-[10px] bg-black/50 border border-[#333] rounded px-2 py-1 max-w-full">
            <option value="">— 비움 —</option>${opts}</select>`;
    };
    const team = st.launch_team || {};
    const desks = st.desks || {};
    const hr = st.hr_card || {};

    const quizHtml = (st.quizzes || []).map(q => {
        if (q.done) return `<div class="text-[10px] text-[#33ff33]">✓ ${q.q} — 완료</div>`;
        return `<div class="al-card p-3 mb-2 border border-[#0A84FF]/40">
            <div class="font-bold text-xs mb-1">🎓 교육 퀴즈</div>
            <p class="text-sm mb-2">${q.q}</p>
            <div class="flex flex-wrap gap-2">${(q.choices||[]).map(ch =>
                `<button onclick="spaceQuiz('${q.id}','${ch.id}')" class="text-[10px] px-3 py-1 border border-[#0A84FF]/50 rounded">${ch.label}</button>`
            ).join('')}</div>
            <p class="text-[9px] text-gray-500 mt-1">${q.kid||''}</p>
        </div>`;
    }).join('');

    const transferHtml = `
        <div class="al-card mb-4 border border-[#ffaa00]/30">
            <div class="font-bold text-sm mb-1">🔧→🔥 항공→우주 전직 (주 1회)</div>
            <p class="text-[10px] text-gray-400 mb-2">채용된 <b>정비사</b>를 우주 추진 엔지니어로 연수 · ${st.transfer_cost_f||''}</p>
            ${!(st.transfer_available) ? '<p class="text-[10px] text-gray-500">이번 주 전직 완료 또는 이미 전직 엔지니어 있음</p>' :
              (st.transfer_candidates||[]).length ? (st.transfer_candidates||[]).map(t =>
                `<button onclick="spaceTransfer('${t.id}')" class="text-[10px] px-3 py-1 mr-1 mb-1 bg-[#ffaa00] text-black rounded font-bold">${t.emoji} ${t.name} 연수</button>`
              ).join('') : '<p class="text-[10px] text-gray-500">항공 팀에 정비사를 먼저 채용하세요</p>'}
        </div>`;

    const assignHtml = `<div class="al-card mb-4 border border-indigo-500/40">
        <div class="font-bold text-sm mb-2">📋 배치 보드</div>
        <p class="text-[9px] text-gray-500 mb-2">${st.kid||''}</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-[10px]">
            <div class="p-2 bg-black/40 rounded">
                <div class="font-bold text-purple-300 mb-1">🚀 발사 팀 (미션)</div>
                <div class="mb-1">지휘 ${slotSelect('mission_director', team.mission_director?.id, `spaceSetTeam('mission_director',this.value)`)}</div>
                <div class="mb-1">궤도 ${slotSelect('flight_dynamics', team.flight_dynamics?.id, `spaceSetTeam('flight_dynamics',this.value)`)}</div>
                <div>탑재 ${slotSelect('payload', team.payload?.id, `spaceSetTeam('payload',this.value)`)}</div>
            </div>
            <div class="p-2 bg-black/40 rounded">
                <div class="font-bold text-blue-300 mb-1">🏢 공통 데스크</div>
                <div class="mb-1">관제 ${slotSelect('ground_control', desks.ground_control?.id, `spaceSetDesk('ground_control',this.value)`)}</div>
                <div>계약 ${slotSelect('business', desks.business?.id, `spaceSetDesk('business',this.value)`)}</div>
                <p class="text-[9px] text-gray-600 mt-2">계약 수령 = 계약 데스크 + 탑재 채용 필수</p>
            </div>
        </div>
        ${sp.last_debrief ? `<p class="text-[10px] text-[#a78bfa] mt-2">📡 ${sp.last_debrief}</p>` : ''}
        ${sp.debrief_bonus ? `<p class="text-[10px] text-[#33ff33]">다음 발사 보너스 +${sp.debrief_bonus}%</p>` : ''}
    </div>
    <div class="al-card mb-4 border border-[#33ff33]/30">
        <div class="font-bold text-sm">📑 ${hr.title||'드림 스페이스 인사'}</div>
        <p class="text-xs text-gray-300 mt-1">${hr.tip||''}</p>
        <p class="text-[10px] text-gray-500 mt-1">우주 인원 ${hr.hired??meta.hired_count??0}명 · 주급 ${hr.payroll_f||meta.weekly_payroll_formatted||'—'}</p>
        <p class="text-[9px] text-gray-600">${hr.kid||''}</p>
    </div>
    ${quizHtml}
    ${transferHtml}`;

    const hiredInner = hiredList.map(c => {
        const p = c.profile || {};
        return `<div class="crew-hired-row">
            <div class="min-w-0"><span class="text-sm">${c.emoji} <b>${c.name}</b></span>
            <span class="text-[10px] text-gray-500 ml-1">${SPACE_ROLE_LABELS[c.space_role]||c.role} · ${p.grade||'?'} · ${fmtPay(p.weekly_pay)}/주</span></div>
            <button type="button" onclick="fireSpaceCrew('${c.id}')" class="crew-fire-btn">해고</button>
        </div>`;
    }).join('');

    const cards = (list) => list.map(c => {
        const p = c.profile || {};
        let action = '';
        if (c.hired) action = `<div class="text-[10px] text-[#33ff33] mt-2">✓ 소속</div>`;
        else if (c.hire_ready || (c.unlocked && !c.hired)) action = `<button onclick="event.stopPropagation();hireSpaceCrew('${c.id}')" class="text-[10px] mt-2 w-full px-2 py-1 bg-indigo-600 rounded font-bold">채용</button>`;
        else action = `<div class="text-[9px] text-[#ffaa00] mt-2">🔒 ${c.unlock_tip||''}</div>`;
        return `<div class="al-card text-center cursor-pointer" onclick="openSpaceCrewModal('${c.id}')">
            <div class="text-3xl">${c.emoji}</div>
            <div class="text-xs font-bold mt-1">${c.name}</div>
            <div class="text-[9px] text-gray-500">${SPACE_ROLE_LABELS[c.space_role]||c.role}</div>
            <div class="text-[9px] text-purple-300">${p.grade_emoji||''} ${p.grade||'?'} · ${fmtPay(p.weekly_pay)}</div>
            <div class="text-[9px] text-gray-500 mt-1">${c.kid||''}</div>
            ${action}
        </div>`;
    }).join('');

    let listHtml = '';
    if (staffRoleFilter === '채용됨') {
        listHtml = `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">${cards(filtered)}</div>`;
    } else {
        const showReady = filtered.filter(c => c.unlocked && !c.hired);
        const showLocked = filtered.filter(c => !c.unlocked);
        listHtml = `
            <h3 class="text-sm font-bold text-indigo-300 mb-2">✨ 채용 가능 (${showReady.length}) · 오늘 남음 ${meta.hires_left_today??2}</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-4">${cards(showReady) || '<p class="text-xs text-gray-500">조건 해금 또는 퀴즈를 풀어 보세요</p>'}</div>
            ${showLocked.length ? `<h3 class="text-sm font-bold text-gray-500 mb-2">🔒 잠김 (${showLocked.length})</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 opacity-70">${cards(showLocked)}</div>` : ''}`;
    }

    const rocketLeadHtml = (sp.rockets||[]).filter(r => r.owned_count > 0).map(r => `
        <div class="flex flex-wrap items-center gap-2 text-[10px] mb-1">
            <span>${r.emoji} ${r.name}</span>
            ${slotSelect('propulsion', r.lead_id, `spaceSetRocketLead('${r.id}',this.value)`)}
        </div>`).join('');

    return `
    ${assignHtml}
    ${rocketLeadHtml ? `<div class="al-card mb-4"><div class="font-bold text-sm mb-2">🔥 로켓 담당 (추진)</div>${rocketLeadHtml}</div>` : ''}
    ${hiredList.length ? `<div class="al-card mb-4"><div class="font-bold text-xs mb-2">채용 ${hiredList.length}/${meta.max_staff||15} · 주급 ${meta.weekly_payroll_formatted||''}</div>
        <div class="space-y-2">${hiredInner}</div></div>` : ''}
    <div class="al-card mb-3 p-3 text-[10px] text-gray-400 border border-indigo-500/30">
        우주 역할은 항공의 기장·항로·정비·화물·운항·영업과 같아요. 배치하면 성공률·비용·계약이 달라져요!
        · <a href="/guide#space_staff" class="text-[#0A84FF]">가이드</a>
    </div>
    <div class="flex gap-1 mb-3 flex-wrap">
        ${roleKeys.map(r => `<button onclick="setStaffFilter('${r}')" class="px-2 py-1 rounded-full text-[10px] border ${staffRoleFilter===r?'border-indigo-400 text-indigo-300':'border-[#333] text-gray-400'}">${r==='전체'||r==='채용됨'?r:(SPACE_ROLE_LABELS[r]||r)}</button>`).join('')}
    </div>
    ${listHtml}`;
}

function openSpaceCrewModal(crewId) {
    const st = (D.space && D.space.staff) || {};
    const c = (st.hireable || []).find(x => x.id === crewId);
    if (!c) return;
    const p = c.profile || {};
    document.getElementById('crew-modal-body').innerHTML = `
        <div class="p-5 border-b border-indigo-500/20 flex justify-between">
            <div class="flex gap-3"><span class="text-4xl">${c.emoji}</span>
            <div><div class="font-bold text-lg">${c.name}</div>
            <div class="text-xs text-gray-400">${c.role}</div>
            <span class="text-xs font-bold text-indigo-300">${p.grade||'?'}등급 · ${fmtPay(p.weekly_pay)}/주</span></div></div>
            <button onclick="closeCrewModal()" class="text-2xl text-gray-400">×</button>
        </div>
        <div class="p-5 text-sm space-y-2">
            <p class="text-xs text-gray-300">${c.kid||''}</p>
            <p class="text-[10px] text-purple-300">특기: ${c.specialty||'—'} · ${c.unlock_tip||''}</p>
            ${c.hired ? `<button onclick="fireSpaceCrew('${c.id}');closeCrewModal();" class="crew-fire-btn w-full">해고</button>` :
              c.unlocked ? `<button onclick="hireSpaceCrew('${c.id}');closeCrewModal();" class="w-full py-2 bg-indigo-600 rounded font-bold">채용</button>` :
              `<p class="text-xs text-[#ffaa00]">🔒 ${c.unlock_tip}</p>`}
        </div>`;
    const modal = document.getElementById('crew-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
}

function hireSpaceCrew(id) { apiPost('/api/airline/space/hire', { crew_id: id }); }
function fireSpaceCrew(id) {
    if (!confirm('우주 팀에서 제외할까요?')) return;
    apiPost('/api/airline/space/fire', { crew_id: id });
}
function spaceSetTeam(role, crewId) {
    const st = (D.space && D.space.staff && D.space.staff.launch_team) || {};
    const team = {
        mission_director: st.mission_director?.id || null,
        flight_dynamics: st.flight_dynamics?.id || null,
        payload: st.payload?.id || null,
    };
    team[role] = crewId || null;
    apiPost('/api/airline/space/team', { team });
}
function spaceSetDesk(deskId, crewId) {
    apiPost('/api/airline/space/desk', { desk_id: deskId, crew_id: crewId || null });
}
function spaceSetRocketLead(rocketId, crewId) {
    apiPost('/api/airline/space/rocket-lead', { rocket_id: rocketId, crew_id: crewId || null });
}
function spaceQuiz(quizId, answer) { apiPost('/api/airline/space/quiz', { quiz_id: quizId, answer }); }
function spaceTransfer(crewId) {
    if (!confirm('정비사를 우주 추진으로 연수할까요? (비용·주 1회)')) return;
    apiPost('/api/airline/space/transfer', { crew_id: crewId });
}

function renderStats() {
    const ps = D.player_stats || {};
    const stats = ps.stats || [];
    return `<div class="al-card mb-4">
        <div class="flex justify-between"><span class="font-bold">플레이어 Lv.${ps.player_level||1}</span>
            <span class="text-sm text-[#ffaa00]">능력 포인트 ${ps.stat_points||0}</span></div>
        <p class="text-[10px] text-gray-500 mt-1">활동하면 능력이 자라요. 포인트로 직접 올릴 수도 있어요!</p>
    </div>
    <div class="space-y-3">${stats.map(s => `
        <div class="al-card">
            <div class="flex justify-between text-sm"><span>${s.emoji} ${s.name}</span><b>Lv.${s.value}</b></div>
            <div class="stat-bar mt-1"><div class="stat-bar-fill" style="width:${s.pct||0}%"></div></div>
            <div class="text-[10px] text-gray-500 mt-1">${s.kid_desc} · XP ${s.xp||0}/${s.xp_need||100}</div>
            ${(ps.stat_points||0)>0 ? `<button onclick="allocStat('${s.id}')" class="text-[10px] mt-2 px-2 py-0.5 border rounded">+1 올리기</button>` : ''}
        </div>`).join('')}</div>
    <a href="/guide#stats" class="text-xs text-[#0A84FF] mt-4 inline-block">능력치 가이드 →</a>`;
}

function renderSpace() {
    const sp = D.space || {};
    if (!sp.unlocked) {
        const p = sp.unlock_progress || {};
        return `<div class="al-card border border-purple-500/30">
            <h2 class="font-bold text-lg">🚀 우주 사업부 (잠김)</h2>
            <p class="text-sm text-gray-400 mt-2">${sp.kid_hint}</p>
            <ul class="text-xs mt-3 space-y-1 text-gray-300">
                <li>항공사 Lv: ${p.airline_level||0} / ${p.need_level||4}</li>
                <li>상상력: ${p.imagination||0} / ${p.need_imagination||30}</li>
                <li>능력 합: ${p.stat_sum||0} / ${p.need_stat_sum||80}</li>
            </ul></div>`;
    }
    const grade = sp.rep_grade || {};
    const edu = sp.edu || {};
    const streams = (sp.revenue_streams||[]).map(s =>
        `<li class="text-[10px] text-gray-400">· <b class="text-gray-300">${s.name}</b> — ${s.kid}</li>`).join('');
    let html = `<div class="al-card mb-4 border border-purple-500/40">
        ${sp.founded ? '<div class="text-[#a78bfa] font-bold">🚀 드림 스페이스 운영 중</div>' :
          '<button onclick="foundSpace()" class="px-4 py-2 bg-purple-600 rounded font-bold text-sm">우주 사업부 설립</button>'}
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-3 text-[10px]">
            <div class="p-2 bg-black/40 rounded">오늘 발사<br><b class="text-white">${sp.launches_today||0}/${sp.daily_launch_limit||5}</b></div>
            <div class="p-2 bg-black/40 rounded">로켓 보유<br><b class="text-white">${sp.rocket_count||0}/${sp.max_rockets||10}</b></div>
            <div class="p-2 bg-black/40 rounded">위성 · 이번 주<br><b class="text-white">${sp.sat_count||0}기 · +${sp.sats_this_week||0}</b></div>
            <div class="p-2 bg-black/40 rounded">누적 우주 수입<br><b class="text-[#ffaa00]">${sp.total_space_revenue_formatted||fmt(sp.total_space_revenue||0)}</b></div>
            <div class="p-2 bg-black/40 rounded">우주 평판<br><b class="text-white">${grade.emoji||''} ${grade.name||''} (${sp.space_rep||0})</b></div>
            <div class="p-2 bg-black/40 rounded">성공 / 실패<br><b class="text-[#33ff33]">${sp.successes||0}</b> / <b class="text-red-400">${sp.fails||0}</b></div>
            <div class="p-2 bg-black/40 rounded">친환경 발사<br><b class="text-[#33ff33]">${sp.eco_launches||0}회</b></div>
            <div class="p-2 bg-black/40 rounded">재사용 절감<br><b class="text-purple-300">${fmt(sp.reuse_saves||0)}</b></div>
        </div>
        <p class="text-[10px] text-gray-500 mt-2">${sp.kid_hint||''}</p>
        ${sp.passive_just_now ? `<p class="text-[10px] text-[#33ff33] mt-1">오늘 수동 수입 +${fmt(sp.passive_just_now)} ${(sp.passive_parts||[]).join(' · ')}</p>` : ''}
        ${streams ? `<ul class="mt-2 space-y-0.5">${streams}</ul>` : ''}
        <div class="text-[9px] text-gray-600 mt-2 space-y-0.5">
            <div>· ${edu.success||'성공률 관리'}</div>
            <div>· ${edu.insurance||'보험'}</div>
            <div>· ${edu.reuse||'재사용'}</div>
            <div>· ${edu.eco||'친환경'}</div>
            <div>· ${edu.contracts||'계약'}</div>
            <div>· ${edu.staff||'채용 탭 → 우주 팀'}</div>
        </div>
        ${sp.last_debrief ? `<p class="text-[10px] text-[#a78bfa] mt-2">📡 ${sp.last_debrief}</p>` : ''}
        <div class="text-xs text-gray-500 mt-2">총 발사 ${sp.launches||0}회 · 고객 계약 ${sp.contracts_done||0}건
            · <button type="button" onclick="staffDivision='space';openAlTab('staff')" class="text-indigo-400 underline">우주 팀 채용·배치</button></div></div>`;

    // 주간 고객 계약 보드
    const contracts = sp.contracts || [];
    if (sp.founded) {
        html += `<div class="al-card mb-4 border border-[#0A84FF]/40">
            <div class="font-bold text-sm mb-1">📋 고객 계약 보드 (주간 퀘스트)</div>
            <p class="text-[10px] text-gray-400 mb-2">이번 주 올린 위성으로 고객 요청을 완료해요. 평판이 높을수록 큰 계약!</p>
            <div class="space-y-2">${contracts.length ? contracts.map(c => `
                <div class="p-2 bg-black/40 rounded flex flex-wrap justify-between gap-2 items-center">
                    <div>
                        <span class="text-lg">${c.emoji||'📋'}</span>
                        <b class="text-sm">${c.client||''}</b>
                        <div class="text-[10px] text-gray-400">${c.kid||''} · 필요 위성 ${c.need_sats||0}기
                            · 진행 <b class="text-white">${c.progress||0}/${c.need_sats||0}</b>
                            ${c.locked?` · 평판 ${c.min_rep}+ 필요`:''}
                        </div>
                        <div class="text-[10px] text-[#ffaa00]">보상 ${fmt(c.reward||0)}</div>
                    </div>
                    ${c.claimed ? '<span class="text-[10px] text-[#33ff33]">완료 ✓</span>' :
                      c.can_claim ? `<button onclick="claimSpaceContract('${c.id}')" class="text-xs px-3 py-1 bg-[#0A84FF] rounded font-bold">수령</button>` :

                친환경 연료 (${sp.eco_fuel_cost_formatted||fmt(sp.eco_fuel_cost||0)}) — 성공률·평판↑ · 환경 스토리
            </label>

        </div>`;
    }

    html += `<h3 class="font-bold text-sm mb-2">로켓 (최대 ${sp.max_rockets||10}기)</h3><div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-4">`;
    html += (sp.rockets||[]).map(r => `
        <div class="al-card text-center">
            <div class="text-3xl">${r.emoji}</div><div class="text-xs font-bold">${r.name}</div>
            <div class="text-[10px] text-gray-500">${r.kid_desc||''}</div>
            ${r.reusable ? `<div class="text-[9px] text-[#33ff33] mt-0.5">♻️ 재사용 · 발사비 −${Math.round((r.launch_discount||0)*100)}%</div>` : ''}
            <div class="text-[10px] text-[#a78bfa] mt-1">보유 ${r.owned_count||0}기</div>

              `<button onclick="buyRocket('${r.id}')" class="text-[10px] mt-1 px-2 py-1 bg-[#ffaa00] text-black rounded">+1 · ${fmt(r.price)}</button>`}
        </div>`).join('');
    html += `</div><h3 class="font-bold text-sm mb-2">발사 미션 (하루 ${(sp.daily_launch_limit||5)}회 · 성공률·평판 연동)</h3><div class="space-y-2">`;
    html += (sp.missions||[]).map(m => `
        <div class="al-card flex justify-between items-center gap-2">
            <div class="min-w-0">
                <span class="text-xl">${m.emoji}</span> <b class="text-sm">${m.name}</b>
                <div class="text-[10px] text-gray-500">${m.kid_desc||''}${m.sat_gain?` · 위성+${m.sat_gain}`:''}
                    ${m.locked_rep?` · 평판 ${m.min_rep}+ 필요`:''}</div>
                <div class="text-[10px] text-[#ffaa00]">보상 ${fmt(m.reward_money||0)}
                    · 성공률 <b class="text-white">${m.success_rate||'?'}%</b>
                    ${m.success_rate_eco?` (에코 ${m.success_rate_eco}%)`:''}
                    ${m.staff_bonus?` · 팀 +${m.staff_bonus}%`:''}</div>
                ${(m.staff_parts||[]).length?`<div class="text-[9px] text-indigo-300">${(m.staff_parts||[]).join(' · ')}</div>`:''}
            </div>
            ${m.can_launch ? `<button onclick="launchMission('${m.id}')" class="text-xs px-3 py-1 bg-purple-600 rounded font-bold shrink-0">발사!</button>` :
              !m.has_rocket ? '<span class="text-xs text-gray-500 shrink-0">로켓 필요</span>' :
              m.locked_rep ? '<span class="text-xs text-gray-500 shrink-0">평판 부족</span>' :
              '<span class="text-xs text-gray-500 shrink-0">오늘 한도</span>'}
        </div>`).join('');
    return html + '</div>';
}

async function applyDashboard(dash) {
    if (!dash) return;
    const prevTab = document.querySelector('.al-tab.active')?.dataset.tab;
    const prevTpl = D.ops?.route_templates;
    const prevRev = D.ops?.revenue_panel;
    const prevInv = D.ops?.invest_panel;
    const prevCrew = D.ops?.hireable_crew;
    const prevFull = D.ops?.crew_full;
    D = dash;
    if (D.ops) {
        if (!(D.ops.route_templates || []).length && prevTpl?.length) D.ops.route_templates = prevTpl;
        if (!D.ops.revenue_panel && prevRev) D.ops.revenue_panel = prevRev;
        if (!D.ops.invest_panel && prevInv) D.ops.invest_panel = prevInv;
        if (prevFull && prevCrew?.length) {
            D.ops.crew_full = false;
        }
    }
    const al = D.airline || {};
    const ops = D.ops || {};
    document.getElementById('al-wallet').textContent = fmt(D.wallet?.balance || 0);
    if (al.founded) {
        document.getElementById('al-title').textContent = `${al.logo||'✈️'} ${al.name} · Lv.${ops.level||1}`;
    }
    if (prevTab === 'revenue' && !ops.revenue_panel) {
        await loadRevenuePanel(true);
    }
    if (prevTab === 'invest' && !ops.invest_panel) {
        await loadInvestPanel(true);
    }
}

async function apiPost(url, body) {
    const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });
    const d = await res.json();
    if (d.error) { alert(d.error); return null; }
    if (d.message) alert(d.message);
    if (d.wallet?.balance != null) {
        D.wallet = d.wallet;
        document.getElementById('al-wallet').textContent = fmt(d.wallet.balance);
    }
    if (d.invest_panel) {
        D.ops = D.ops || {};
        D.ops.invest_panel = d.invest_panel;
    }
    if (d.space) D.space = d.space;
    if (d.staff && D.space) D.space.staff = d.staff;
    if (d.revenue_panel) {
        D.ops = D.ops || {};
        D.ops.revenue_panel = d.revenue_panel;
    }
    if (d.dashboard) {
        await applyDashboard(d.dashboard);
        if (d.invest_panel) D.ops.invest_panel = d.invest_panel;
        if (d.revenue_panel) D.ops.revenue_panel = d.revenue_panel;
        if (d.space) D.space = d.space;
        if (d.staff && D.space) D.space.staff = d.staff;
        const tab = document.querySelector('.al-tab.active')?.dataset.tab || 'overview';
        if (!document.getElementById('al-founded').classList.contains('hidden')) {
            if (tab === 'staff') D.ops.crew_full = false;
            if (tab === 'revenue' && d.revenue_panel) {
                document.getElementById('al-content').innerHTML = renderRevenue();
            } else {
                await openAlTab(tab);
            }
        }
    } else if (d.revenue_panel) {
        const tab = document.querySelector('.al-tab.active')?.dataset.tab;
        if (tab === 'revenue') {
            document.getElementById('al-content').innerHTML = renderRevenue();
        }
    } else if (d.invest_panel) {
        const tab = document.querySelector('.al-tab.active')?.dataset.tab;
        if (tab === 'invest') {
            document.getElementById('al-content').innerHTML = renderInvest();
            refreshInvestGlossary(false);
        }
    } else if (d.space || d.staff) {
        if (d.staff && D.space) D.space.staff = d.staff;
        const tab = document.querySelector('.al-tab.active')?.dataset.tab;
        if (tab === 'space') {
            document.getElementById('al-content').innerHTML = renderSpace();
        } else if (tab === 'staff') {
            document.getElementById('al-content').innerHTML = renderStaff();
        }
    } else {
        await loadDash({ light: true });
    }
    return d;
}

async function loadTreasuryPanel(force) {
    if (!force && D.ops?.treasury_panel) {
        const el = document.getElementById('al-content');
        if (el && document.querySelector('.al-tab.active')?.dataset.tab === 'treasury') {
            el.innerHTML = renderTreasury();
        }
        return;
    }
    try {
        const res = await fetch('/api/airline/treasury');
        const data = await res.json();
        if (data.error && !data.treasury) {
            const el = document.getElementById('al-content');
            if (el) el.innerHTML = `<div class="al-card"><p class="text-red-400 text-sm">${data.error}</p></div>`;
            return;
        }
        D.ops = D.ops || {};
        D.ops.treasury_panel = data.treasury;
        if (data.wallet) {
            D.wallet = data.wallet;
            const w = document.getElementById('al-wallet');
            if (w && data.wallet.balance != null) w.textContent = fmt(data.wallet.balance);

        }

            if (data.dashboard.wallet) D.wallet = data.dashboard.wallet;
        }
        const el = document.getElementById('al-content');
        if (el && document.querySelector('.al-tab.active')?.dataset.tab === 'treasury') {
            el.innerHTML = renderTreasury();
        }
    } catch (e) {
        const el = document.getElementById('al-content');
        if (el) el.innerHTML = '<p class="text-red-400 text-sm">자금 탭 연결 오류</p>';
    }
}

async function treasuryAction(kind, action, all) {
    const idMap = { capital: 'tx-capital-amt', lend: 'tx-lend-amt', borrow: 'tx-borrow-amt' };
    const pathMap = {
        capital: '/api/airline/treasury/capital',
        lend: '/api/airline/treasury/lend',
        borrow: '/api/airline/treasury/borrow',
    };
    const url = pathMap[kind];
    if (!url) return;
    let amount = null;
    if (!all) {
        const el = document.getElementById(idMap[kind]);
        const raw = el ? el.value : '';
        amount = raw === '' || raw == null ? null : Number(raw);
        if (amount == null || !Number.isFinite(amount) || amount <= 0) {
            alert('금액을 입력해주세요. (전액은 전액 버튼 사용)');
            return;
        }
    }
    const labels = {
        capital: { deposit: '가수금 납입', recover: '가수금 회수' },
        lend: { deposit: '대여 실행', recover: '대여 원금 회수' },
        borrow: { borrow: '회사 차입', repay: '차입 상환' },
    };
    const title = (labels[kind] && labels[kind][action]) || action;
    if (!confirm(`${title}${all ? ' (전액)' : ' ₩' + Number(amount).toLocaleString()} 할까요?`)) return;

    try {
        const body = { action };
        if (!all) body.amount = Math.floor(amount);
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok || data.error) {
            alert(data.error || '처리 실패');
            return;
        }
        if (data.message) {
            const toast = document.getElementById('al-income-toast');
            if (toast) {
                toast.textContent = data.message;
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 4000);
            } else {
                alert(data.message);
            }
        }
        if (data.wallet) {
            D.wallet = data.wallet;
            const w = document.getElementById('al-wallet');
            if (w) {
                if (data.wallet.balance != null) w.textContent = fmt(data.wallet.balance);
                else if (data.wallet.balance_formatted) w.textContent = data.wallet.balance_formatted;
            }
        }
        if (data.treasury) {
            D.ops = D.ops || {};
            D.ops.treasury_panel = data.treasury;
        }
        if (data.dashboard?.ops) {
            D.ops = { ...D.ops, ...data.dashboard.ops, treasury_panel: data.treasury || D.ops.treasury_panel };
        }
        const el = document.getElementById('al-content');
        if (el) el.innerHTML = renderTreasury();
    } catch (e) {
        alert('요청 실패: ' + (e.message || e));
    }
}

async function settleNow() {
    const rv = D.ops?.revenue_preview || {};
    if (!(rv.active_routes > 0)) {
        if (!confirm('활성 노선이 없어요. 주급만 나갈 수 있습니다.\n그래도 받을까요?')) return;
    }
    const res = await fetch('/api/airline/settle', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    const d = await res.json();
    if (d.error) { alert(d.error); return; }
    // 이미 오늘 받았거나 미수령 없음 — 친절 안내 (오류 아님)
    if (d.already_done || d.status === 'already_done') {
        alert(d.message || '오늘 운영 수익은 이미 반영됐어요. 내일 다시 확인해 주세요!');
        if (d.wallet?.balance != null) {
            D.wallet = d.wallet;
            document.getElementById('al-wallet').textContent = fmt(d.wallet.balance);
        }
        await loadDash({ light: true });
        return;
    }
    if (!d.gross && !d.payroll) {
        alert(d.message || '지금은 받을 미수령 수익이 없어요. 내일 다시 확인해 주세요!');
        return;
    }
    let msg = d.message || `수익 반영!\n운영 수익: +${d.formatted_gross||fmt(d.gross||0)}`;
    if (!d.message) {
        if (d.days_accrued > 1) msg += ` (${d.days_accrued}일치)`;
        msg += `\n주급: −${d.formatted_payroll||fmt(d.payroll||0)}\n순수익: ${d.formatted_net||fmt(d.net||0)}`;
    } else {
        if (d.gross || d.payroll) {
            msg += `\n\n운영: +${d.formatted_gross||fmt(d.gross||0)} · 주급: −${d.formatted_payroll||fmt(d.payroll||0)} · 순: ${d.formatted_net||fmt(d.net||0)}`;
        }
    }
    if (d.payroll_warning) msg += `\n⚠️ ${d.payroll_warning}`;
    if (d.details?.length) {
        msg += '\n\n노선별:';
        d.details.forEach(x => { msg += `\n· ${x.route||x.name}: ${fmt(x.money)} (보너스+${x.bonus_pct||0}%)`; });
    }
    alert(msg);
    if (d.wallet?.balance != null) {
        D.wallet = d.wallet;
        document.getElementById('al-wallet').textContent = fmt(d.wallet.balance);
    }
    await loadDash({ light: true });
}

// 첫 진입: light 대시보드 + 수익 tick 분리 호출
(async function bootAirline() {
    await loadDash({ light: true, tick: false });
    // 백그라운드 일일 정산 (UI 막지 않음)
    try {
        const res = await fetch('/api/airline/tick', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        const d = await res.json();
        if (d.tick) showEconomyTick(d.tick);
        if (d.wallet?.balance != null) {
            D.wallet = d.wallet;
            document.getElementById('al-wallet').textContent = fmt(d.wallet.balance);
        }
        if (d.dashboard) {
            await applyDashboard(d.dashboard);
            const tab = document.querySelector('.al-tab.active')?.dataset.tab || 'overview';
            if (tab === 'overview') await openAlTab('overview');
        }
    } catch (e) { /* tick optional */ }
})();
</script>
