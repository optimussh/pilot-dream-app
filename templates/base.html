<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pilot Dream App{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Apple-style clean design */
        :root {
            --accent: #0A84FF;
            --accent-hover: #409CFF;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0a0a0c;
            color: #f5f5f7;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
        }

        .nav-link {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: #a1a1aa;
            border-radius: 9999px;
            padding: 8px 16px;
            font-weight: 500;
        }

        .nav-link:hover {
            color: #fff;
            background-color: #1f1f24;
        }

        .nav-link.active {
            color: #fff;
            background-color: #1f1f24;
            font-weight: 600;
        }

        .info-card {
            background: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), 
                        box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .info-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
        }

        h1, h2, h3 {
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .accent {
            color: var(--accent);
        }

        .section-title {
            border-bottom: 1px solid #3a3a3c;
            padding-bottom: 8px;
            margin-bottom: 16px;
            font-weight: 600;
            color: #f5f5f7;
        }

        /* Apple-like buttons */
        .apple-btn {
            background: #1c1c1e;
            border: 1px solid #3a3a3c;
            color: #f5f5f7;
            transition: all 0.2s;
            border-radius: 12px;
            font-weight: 500;
        }

        .apple-btn:hover {
            background: #2c2c2e;
            border-color: var(--accent);
        }

        .apple-btn-primary {
            background: var(--accent);
            color: white;
            border: none;
        }

        .apple-btn-primary:hover {
            background: var(--accent-hover);
        }

        /* Softer text colors */
        .text-muted {
            color: #8e8e93;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen">
    <nav class="bg-[#1c1c1e]/95 backdrop-blur-xl border-b border-[#2c2c2e] px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <span class="text-3xl">✈️</span>
            <span class="font-semibold text-2xl tracking-tight">Pilot Dream</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-sm hidden sm:block">
                <span class="text-gray-500">지갑</span>
                <span id="nav-wallet" class="font-bold text-[#ffaa00] ml-1">₩0</span>
            </div>
        <div class="flex gap-1 text-sm font-medium items-center flex-wrap justify-end">
            <a href="/" class="nav-link {{ 'active' if request.path == '/' or request.path.startswith('/captain-day') or request.path.startswith('/first-flight') else '' }}">오늘</a>
            <a href="/logbook" class="nav-link {{ 'active' if request.path.startswith('/logbook') else '' }}">기록</a>
            <a href="/airline" class="nav-link {{ 'active' if request.path.startswith('/airline') else '' }}">항공사</a>
            <div class="relative">
                <button type="button" id="nav-more-btn" class="nav-link">더보기 ▾</button>
                <div id="nav-more-panel" class="hidden absolute right-0 mt-2 w-64 max-h-[70vh] overflow-auto bg-[#1c1c1e] border border-[#2c2c2e] rounded-2xl shadow-xl p-2 z-[80]"></div>
            </div>
        </div>
        </div>
    </nav>
    <div id="duty-bar" class="hidden sticky top-[64px] z-40 px-4 py-2 bg-[#001a33] border-b border-[#0A84FF]/40">
        <a href="/captain-day" class="max-w-7xl mx-auto flex items-center justify-between gap-3 text-sm">
            <span id="duty-bar-text" class="text-gray-200">오늘의 편</span>
            <span class="text-[#ffaa00] font-bold">이어서 →</span>
        </a>
    </div>

    <main class="max-w-7xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/js/celebrations.js"></script>
    <script src="/static/js/gamification.js"></script>
    <script>
    (function () {
        const btn = document.getElementById('nav-more-btn');
        const panel = document.getElementById('nav-more-panel');
        if (btn && panel) {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                panel.classList.toggle('hidden');
            });
            document.addEventListener('click', () => panel.classList.add('hidden'));
            panel.addEventListener('click', (e) => e.stopPropagation());
            fetch('/api/nav/more').then(r => r.json()).then(d => {
                const items = d.items || [];
                panel.innerHTML = items.map(it =>
                    `<a href="${it.href}" class="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-[#2c2c2e] text-sm">
                        <span>${it.emoji}</span><span>${it.label}</span>
                    </a>`
                ).join('');
            }).catch(() => {});
        }
        const path = location.pathname || '';
        if (path === '/captain-day' || path.startsWith('/captain-day')) return;
        fetch('/api/duty/today').then(r => r.json()).then(d => {
            if (!d || d.complete) return;
            const bar = document.getElementById('duty-bar');
            const txt = document.getElementById('duty-bar-text');
            if (!bar || !txt) return;
            const f = d.flight || {};
            txt.textContent = `${f.flight_number || '오늘의 편'}  ${f.origin || ''}→${f.dest || ''}  ·  ${d.core_done}/${d.core_total}`;
            bar.classList.remove('hidden');
        }).catch(() => {});
    })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
